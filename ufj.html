<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>萬家福行動商店購物車</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1d2329;--muted:#6b7580;--line:#e3e7eb;--brand:#d6262d;--brand-2:#b51d23;--ok:#1f8a4c;--up:#d6262d;--down:#1f8a4c}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1c1f24;--text:#e8ebee;--muted:#98a1ab;--line:#2c3138}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding-bottom:96px}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:12px 16px 10px}
header h1{margin:0 0 8px;font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
header button.gear{background:none;border:0;color:#fff;font-size:20px;padding:0 4px}
.searchbar{display:flex;gap:8px}
.searchbar input{flex:1;min-width:0;border:0;border-radius:10px;padding:10px 12px;font-size:16px}
.searchbar button{border:0;border-radius:10px;padding:0 16px;background:#fff;color:var(--brand);font-weight:700;font-size:15px}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:11px 0;font-size:15px;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--brand);border-color:var(--brand);font-weight:700}
main{padding:12px 16px}
.status{color:var(--muted);font-size:13px;margin:4px 0 10px}
.tags{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tags button{border:1.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.12);color:#fff;border-radius:16px;padding:5px 12px;font-size:14px;font-weight:700}
.tags button.on{background:#fff;color:var(--brand)}
.badge{color:#fff;font-size:12px;font-weight:800;border-radius:6px;padding:2px 7px;align-self:center}
.badge.bogo{background:#d6262d}.badge.half{background:#7048e8}
.hint{margin-top:5px;background:#fff4e6;color:#c2410c;border-radius:6px;padding:4px 8px;font-size:12.5px;font-weight:700}
.hint.warn{background:#ffe3e3;color:#c92a2a}
@media (prefers-color-scheme:dark){.hint{background:#3b2a1a;color:#ffc078}.hint.warn{background:#3b1f1f;color:#ff8787}}
.cust{display:flex;align-items:center;gap:8px;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;font-size:13px;color:var(--muted)}
.cust b{color:var(--text)}.cust span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cust button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:4px 10px;font-size:13px;flex:none}
#dlgCust input{font-size:16px}
#dlgCust .err{color:#d6262d;font-size:13px;min-height:18px;margin-top:6px}
.notice{color:#d6262d;font-weight:700;font-size:15px;margin:2px 0 10px}
.nosub{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text);white-space:nowrap;margin-left:auto}
.nosub input{width:18px;height:18px;accent-color:#d6262d;margin:0}
.nosub.on{color:#d6262d;font-weight:700}
.item{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.item img{width:72px;height:72px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
.item .info{flex:1;min-width:0}
.item .name{font-weight:600;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .meta{color:var(--muted);font-size:12px;margin-top:2px}
.price{margin-top:4px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price b{color:var(--brand);font-size:17px}
.price s{color:var(--muted);font-size:12px}
.chg{font-size:12px;font-weight:700}.chg.up{color:var(--up)}.chg.down{color:var(--down)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{width:34px;height:32px;border:0;background:var(--bg);color:var(--text);font-size:18px}
.qty input{width:40px;height:32px;border:0;text-align:center;font-size:15px;background:var(--card);color:var(--text)}
.add{border:0;border-radius:8px;background:var(--brand);color:#fff;padding:7px 12px;font-size:14px;font-weight:600}
.add.in{background:var(--ok)}
.del{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;z-index:6}
.bar .sum{flex:1;font-size:13px;color:var(--muted)}.bar .sum b{display:block;font-size:18px;color:var(--text)}
.bar button{border:0;border-radius:10px;background:var(--brand);color:#fff;padding:12px 14px;font-size:15px;font-weight:700}
.bar button:disabled{opacity:.4}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:8px 12px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
dialog{border:0;border-radius:14px;padding:18px;width:min(92vw,480px);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 10px;font-size:17px}
dialog label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
dialog input,dialog textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:14px;background:var(--bg);color:var(--text)}
dialog textarea{height:90px;font-family:ui-monospace,monospace;font-size:11px}
dialog ol{padding-left:20px;margin:6px 0;font-size:14px}
dialog .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
dialog .btns button{border:0;border-radius:8px;padding:9px 14px;font-size:14px;background:var(--bg);color:var(--text)}
dialog .btns button.primary{background:var(--brand);color:#fff}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>萬家福行動商店購物車</h1>
  <form class="searchbar" id="sf">
    <input id="q" type="search" placeholder="搜尋商品，例如：泡麵、衛生紙" autocomplete="off">
    <button>搜尋</button>
  </form>
  <div class="tags"><button type="button" data-tag="bogo">買一送一</button><button type="button" data-tag="half">第二件五折</button><button type="button" data-q="火鍋" data-more="火鍋料,湯底,沙茶,貢丸,魚丸,燕餃,蛋餃,鍋燒">火鍋</button><button type="button" data-q="暖暖">暖暖</button></div>
</header>
<nav class="tabs">
  <button id="tSearch" class="on">搜尋結果</button>
  <button id="tList">採購清單 <span id="cnt"></span></button>
</nav>
<div class="cust" id="custBar"></div>
<main id="main"></main>
<div class="bar">
  <div class="sum">清單 <span id="bItems">0</span> 項・<span id="bQty">0</span> 件<b id="bTotal">$0</b></div>
  <button id="shot" disabled>截圖購物車列表</button>
</div>
<div class="toast" id="toast"></div>
<dialog id="dlgCust">
  <h2>訂購人資料</h2>
  <p style="font-size:13px;color:var(--muted);margin:0">填一次就會記住，下次打開不用重填</p>
  <label>姓名</label>
  <input id="cName" autocomplete="name" placeholder="例如：王小明">
  <label>取貨地點（社區或公司行號名稱）</label>
  <input id="cPlace" placeholder="例如：觀星台北社區、統祥公司">
  <label>聯絡電話</label>
  <input id="cPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="例如：0912345678">
  <div class="err" id="cErr"></div>
  <div class="btns"><button class="primary" id="cSave" style="width:100%;padding:12px;font-size:16px">開始購物</button></div>
</dialog>
<div id="saveView" style="display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);overflow:auto;padding:16px">
  <div style="color:#fff;font-weight:700;font-size:16px;text-align:center;margin:8px 0 12px">👆 長按圖片 →「儲存到照片」</div>
  <img id="saveImg" alt="購物車列表" style="width:100%;display:block;border-radius:8px;-webkit-touch-callout:default">
  <button id="saveClose" style="display:block;margin:16px auto 24px;border:0;border-radius:10px;padding:12px 28px;font-size:16px;font-weight:700;background:#fff;color:#1d2329">關閉</button>
</div>



<dialog id="dlgShot">
  <h2>購物車列表截圖</h2>
  <p style="font-size:13px;color:var(--muted);margin:0 0 8px">按「分享到 LINE」後，在分享選單選 LINE 即可傳送；也可長按圖片儲存</p>
  <div style="max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:8px"><img id="shotImg" alt="購物車列表" style="width:100%;display:block"></div>
  <div class="btns"><button onclick="dlgShot.close()">關閉</button><button id="dlShot">儲存圖片</button><button class="primary" id="shareShot" style="background:#06c755">分享到 LINE</button></div>
</dialog>

<script>
const UJF = 'https://online.uni-prosperity.com.tw';
const STALE_MS = 6 * 3600 * 1000;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const gas = 'https://script.google.com/macros/s/AKfycbwUO_YYugwDX0XqYYDKjz6oxaJG8SZeKvpkJpbrlLRmv6OAkArbb5OL6Sjhia6V4RUo/exec';
let list = store.get('list', {});          // id -> {id,name,img,unit,url,price,prev,qty,ts}
let results = [], resultInfo = '', tab = 'search', lastQ = '';
const pendingNoSub = {};   // 尚未加入清單的商品，先記住「請勿更換」勾選

const $ = id => document.getElementById(id);
const money = n => '$' + (n == null ? '-' : Number(n).toLocaleString());
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PROMO = { bogo: '買一送一', half: '第二件五折' };
const halfOf = p => Math.round((p || 0) / 2);
// 小計：買一送一 = 付一半件數；第二件五折 = 每 2 件其中 1 件半價
function lineTotal(it) {
  const p = it.price || 0, q = it.qty, pairs = Math.floor(q / 2), rem = q % 2;
  if (it.promo === 'bogo') return (pairs + rem) * p;
  if (it.promo === 'half') return pairs * (p + halfOf(p)) + rem * p;
  return p * q;
}
function promoHint(it, inList) {
  if (!it.promo) return '';
  if (!inList) return `<div class="hint">${PROMO[it.promo]}：數量請下 2 的倍數</div>`;
  const q = it.qty, pairs = Math.floor(q / 2);
  if (q % 2) return it.promo === 'bogo'
    ? `<div class="hint warn">⚠ 目前 ${q} 件，再加 1 件可多送 1 件</div>`
    : `<div class="hint warn">⚠ 目前 ${q} 件，再加 1 件第 ${q + 1} 件只要 ${money(halfOf(it.price))}</div>`;
  return it.promo === 'bogo'
    ? `<div class="hint">✓ ${q} 件（付 ${pairs} 件，送 ${pairs} 件）</div>`
    : `<div class="hint">✓ ${q} 件（${pairs} 件半價，共 ${money(lineTotal(it))}）</div>`;
}
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1800); }
function save() { store.set('list', list); renderBar(); }

async function api(params) {
  const r = await fetch(gas + '?' + new URLSearchParams(params));
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '讀取失敗');
  return j;
}

/* 搜尋 */
$('sf').onsubmit = async e => {
  e.preventDefault();
  const q = $('q').value.trim(); if (!q) return;
  lastQ = q; setTab('search');
  document.querySelectorAll('.tags button').forEach(b => b.classList.toggle('on', b.dataset.q === q));
  resultInfo = '搜尋中…'; results = []; render();
  try {
    const tag = [...document.querySelectorAll('.tags button')].find(b => b.dataset.q === q && b.dataset.more);
    if (tag) {
      // 類別標籤：同時搜好幾個關鍵字，合併後最多顯示 100 項
      const words = [q].concat(tag.dataset.more.split(','));
      const all = await Promise.all(words.map(w => api({ action: 'search', q: w, pages: 4 }).catch(() => ({ items: [] }))));
      const seen = {};
      results = [];
      all.forEach(j => (j.items || []).forEach(it => { if (!seen[it.id]) { seen[it.id] = 1; results.push(it); } }));
      results = results.slice(0, 100);
      resultInfo = results.length ? `${esc(q)}類商品共 ${results.length} 項` : `找不到「${esc(q)}」相關商品`;
    } else {
      const j = await api({ action: 'search', q, pages: 4 });
      results = j.items;
      resultInfo = j.count ? '' : `找不到「${esc(q)}」相關商品`;
    }
    results.forEach(it => { if (list[it.id]) { list[it.id].promo = it.promo || ''; updateFromFresh(list[it.id], it.price); } });
    save();
  } catch (err) { resultInfo = '⚠ ' + esc(err.message); }
  render();
};

async function browsePromo(type) {
  setTab('search');
  document.querySelectorAll('.tags button').forEach(b => b.classList.toggle('on', b.dataset.tag === type));
  $('q').value = '';
  resultInfo = `${PROMO[type]}商品載入中…（第一次會比較久）`; results = []; render();
  try {
    const j = await api({ action: 'promo', type });
    results = j.items;
    resultInfo = j.count ? `${PROMO[type]}商品共 ${j.count} 項` : `目前沒有${PROMO[type]}商品`;
    results.forEach(it => { if (list[it.id]) { list[it.id].promo = it.promo; updateFromFresh(list[it.id], it.price); } });
    save();
  } catch (err) { resultInfo = '⚠ ' + esc(err.message); }
  render();
}
document.querySelectorAll('.tags button').forEach(b => b.onclick = () => {
  if (b.dataset.q) { $('q').value = b.dataset.q; $('sf').requestSubmit ? $('sf').requestSubmit() : $('sf').onsubmit(new Event('submit')); }
  else browsePromo(b.dataset.tag);
});

function updateFromFresh(item, price) {
  if (price == null) return;
  if (item.price != null && item.price !== price) item.prev = item.price;
  item.price = price; item.ts = Date.now();
}

/* 更新清單價格 */
async function refreshPrices(silent) {
  const ids = Object.keys(list); if (!ids.length) return;
  if (!silent) toast('更新價格中…');
  try {
    const j = await api({ action: 'prices', ids: ids.join(',') });
    let changed = 0, gone = 0;
    ids.forEach(id => {
      const p = j.prices[id]; if (!p) return;
      if (!p.available) { list[id].unavailable = true; gone++; return; }
      list[id].unavailable = false;
      if (p.promo != null) list[id].promo = p.promo;
      const before = list[id].price; updateFromFresh(list[id], p.price);
      if (before !== list[id].price) changed++;
    });
    store.set('listTs', Date.now()); save(); render();
    toast(`價格已更新・${changed} 項變動` + (gone ? `・${gone} 項查無` : ''));
  } catch (err) { if (!silent) toast('⚠ ' + err.message); }
}

/* 清單操作 */
function addItem(it, qty) {
  if (list[it.id]) list[it.id].qty += qty;
  else list[it.id] = { id: it.id, name: it.name, img: it.img, unit: it.unit, url: it.url, price: it.price, prev: null, qty, ts: Date.now(), noSub: !!pendingNoSub[it.id], promo: it.promo || '' };
  save(); render(); toast('已加入清單');
}
function setQty(id, q) { if (!list[id]) return; list[id].qty = Math.max(1, Math.min(99, q | 0 || 1)); save(); render(); }
function removeItem(id) { delete list[id]; save(); render(); }
function setNoSub(id, on) {
  if (list[id]) { list[id].noSub = on; save(); } else pendingNoSub[id] = on;
  render();
}

/* 畫面 */
function setTab(t) { tab = t; $('tSearch').classList.toggle('on', t === 'search'); $('tList').classList.toggle('on', t === 'list'); render(); }
$('tSearch').onclick = () => setTab('search');
$('tList').onclick = () => setTab('list');

function qtyBox(id, val, onSet) {
  return `<div class="qty"><button data-a="minus" data-id="${id}">−</button><input data-a="q" data-id="${id}" inputmode="numeric" value="${val}"><button data-a="plus" data-id="${id}">＋</button></div>`;
}
function card(it, inList) {
  const chg = inList && it.prev != null && it.prev !== it.price
    ? `<span class="chg ${it.price > it.prev ? 'up' : 'down'}">${it.price > it.prev ? '▲' : '▼'} 原 ${money(it.prev)}</span>` : '';
  const ns = list[it.id] ? !!list[it.id].noSub : !!pendingNoSub[it.id];
  const box = `<label class="nosub ${ns ? 'on' : ''}"><input type="checkbox" data-a="nosub" data-id="${it.id}" ${ns ? 'checked' : ''}>請勿更換</label>`;
  const right = inList
    ? `${qtyBox(it.id, it.qty)}${box}<button class="del" data-a="del" data-id="${it.id}">移除</button>`
    : `${qtyBox(it.id, it.promo ? 2 : 1)}${box}<button class="add ${list[it.id] ? 'in' : ''}" data-a="add" data-id="${it.id}">${list[it.id] ? '再加' : '加入'}</button>`;
  return `<div class="item">
    <img src="${esc(it.img)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
    <div class="info">
      <a class="name" href="${esc(it.url)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(it.name)}</a>
      <div class="meta">${it.unit ? esc(it.unit) + '入・' : ''}${esc(it.id)}${it.unavailable ? '・<b style="color:var(--up)">查無／下架</b>' : ''}</div>
      <div class="price"><b>${money(it.price)}</b>${it.list ? `<s>${money(it.list)}</s>` : ''}${it.promo ? `<span class="badge ${it.promo}">${PROMO[it.promo]}</span>` : ''}${chg}</div>
      ${promoHint(inList ? it : it, inList)}
      <div class="row">${right}</div>
    </div></div>`;
}
function render() {
  const n = Object.keys(list).length; $('cnt').textContent = n ? `(${n})` : '';
  let h = '';
  if (tab === 'search') {
    h += `<div class="notice">如果此商品售完，我們將為您選擇替代商品</div>`;
    if (resultInfo) h += `<div class="status">${resultInfo}</div>`;
    h += results.map(it => card(it, false)).join('');
  } else {
    const ts = store.get('listTs', 0);
    h += `<div class="tools"><button data-a="refresh">↻ 更新價格</button><button data-a="clear">清空清單</button></div>`;
    h += `<div class="status">${ts ? '價格更新於 ' + new Date(ts).toLocaleString('zh-TW', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '尚未更新價格'}</div>`;
    h += n ? Object.values(list).map(it => card(it, true)).join('') : '<div class="empty">清單是空的，先去搜尋加入商品</div>';
  }
  $('main').innerHTML = h; renderBar();
}
function renderBar() {
  const items = Object.values(list);
  $('bItems').textContent = items.length;
  $('bQty').textContent = items.reduce((s, i) => s + i.qty, 0);
  $('bTotal').textContent = money(items.reduce((s, i) => s + lineTotal(i), 0));
  $('shot').disabled = !items.length;
}

$('main').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.dataset.a === 'nosub') return;
  const id = b.dataset.id, a = b.dataset.a;
  const row = b.closest('.row'); const inp = row && row.querySelector('input');
  if (a === 'minus' || a === 'plus') {
    const v = Math.max(1, (parseInt(inp.value, 10) || 1) + (a === 'plus' ? 1 : -1));
    if (tab === 'list') setQty(id, v); else inp.value = v;
  } else if (a === 'add') { const it = results.find(r => r.id === id); if (it) addItem(it, parseInt(inp.value, 10) || 1); }
  else if (a === 'del') removeItem(id);
  else if (a === 'refresh') refreshPrices(false);
  else if (a === 'clear') { if (confirm('確定清空採購清單？')) { list = {}; save(); render(); } }
});
$('main').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.a === 'q' && tab === 'list') setQty(t.dataset.id, parseInt(t.value, 10));
  if (t.dataset.a === 'nosub') setNoSub(t.dataset.id, t.checked);
});

/* 訂購人資料（記在這支手機的瀏覽器裡） */
let cust = store.get('cust', null);
function renderCust() {
  $('custBar').innerHTML = cust
    ? `<span>訂購人：<b>${esc(cust.name)}</b>・${esc(cust.place)}・${esc(cust.phone)}</span><button id="cEdit">修改</button>`
    : `<span>尚未填寫訂購人資料</span><button id="cEdit">填寫</button>`;
  $('cEdit').onclick = openCust;
}
function openCust() {
  $('cName').value = cust ? cust.name : ''; $('cPlace').value = cust ? cust.place : ''; $('cPhone').value = cust ? cust.phone : '';
  $('cErr').textContent = '';
  $('dlgCust').showModal();
}
$('dlgCust').addEventListener('cancel', e => { if (!cust) e.preventDefault(); });   // 第一次一定要填
$('cSave').onclick = () => {
  const name = $('cName').value.trim(), place = $('cPlace').value.trim();
  const phone = $('cPhone').value.replace(/[^\d+#-]/g, '');
  if (!name) return $('cErr').textContent = '請填寫姓名';
  if (!place) return $('cErr').textContent = '請填寫取貨地點（社區或公司行號名稱）';
  if (phone.replace(/\D/g, '').length < 8) return $('cErr').textContent = '請填寫正確的聯絡電話';
  cust = { name, place, phone }; store.set('cust', cust);
  $('dlgCust').close(); renderCust(); toast('已記住訂購人資料');
};
renderCust();
if (!cust) setTimeout(openCust, 200);

/* 截圖購物車列表 */
function wrapLines(ctx, text, maxW) {
  const out = []; let line = '';
  for (const ch of String(text)) {
    if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; } else line += ch;
  }
  if (line) out.push(line);
  return out;
}
// 載入縮圖：先直接載入，不行就請 Apps Script 轉成 data URL
const imgCache = {};
function loadImage(src, cors) {
  return new Promise(res => {
    const im = new Image();
    if (cors) im.crossOrigin = 'anonymous';
    const t = setTimeout(() => res(null), 5000);
    im.onload = () => { clearTimeout(t); res(im); };
    im.onerror = () => { clearTimeout(t); res(null); };
    im.src = src;
  });
}
async function loadThumbs(items) {
  const out = {}, need = [];
  await Promise.all(items.map(async it => {
    if (!it.img) return;
    if (imgCache[it.img]) { out[it.id] = imgCache[it.img]; return; }
    const im = await loadImage(it.img, true);
    if (im) { imgCache[it.img] = im; out[it.id] = im; } else need.push(it);
  }));
  for (let i = 0; i < need.length; i += 6) {
    const batch = need.slice(i, i + 6);
    try {
      const j = await api({ action: 'imgs', u: batch.map(x => x.img).join('|') });
      await Promise.all(batch.map(async it => {
        const d = j.images && j.images[it.img]; if (!d) return;
        const im = await loadImage(d, false);
        if (im) { imgCache[it.img] = im; out[it.id] = im; }
      }));
    } catch (e) {}
  }
  return out;
}

async function drawList() {
  const items = Object.values(list);
  const thumbs = await loadThumbs(items);
  const W = 1200, P = 48, TH = 76;
  const font = '"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
  const cols = { thumb: P, name: P + TH + 18, note: 760, qty: 900, price: 1030, sub: W - P };
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const rows = items.map(it => {
    ctx.font = `600 30px ${font}`;
    const lines = wrapLines(ctx, it.name, cols.note - 70 - cols.name);
    return { it, lines, h: Math.max(lines.length * 40 + 52, 104) };
  });
  const headerH = 300, tableHead = 64, footH = 150;
  const H = headerH + tableHead + rows.reduce((s, r) => s + r.h, 0) + footH;
  c.width = W; c.height = H;

  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#d6262d'; ctx.fillRect(0, 0, W, 130);
  ctx.fillStyle = '#ffffff'; ctx.font = `700 46px ${font}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText('萬家福行動商店購物車', P, 66);
  ctx.font = `400 28px ${font}`; ctx.textAlign = 'right';
  const now = new Date();
  ctx.fillText(now.toLocaleDateString('zh-TW') + ' ' + now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }), W - P, 66);
  // 訂購人資料
  ctx.fillStyle = '#fff4e6'; ctx.fillRect(0, 130, W, 120);
  ctx.textAlign = 'left'; ctx.fillStyle = '#1d2329';
  const kv = (k, v, x, yy) => {
    ctx.font = `400 28px ${font}`; ctx.fillStyle = '#6b7580'; ctx.fillText(k, x, yy);
    const kw = ctx.measureText(k).width;
    ctx.font = `700 30px ${font}`; ctx.fillStyle = '#1d2329'; ctx.fillText(v, x + kw, yy);
  };
  const c0 = cust || { name: '', place: '', phone: '' };
  kv('姓名：', c0.name, P, 168);
  kv('電話：', c0.phone, 640, 168);
  kv('取貨地點：', c0.place, P, 216);
  ctx.textAlign = 'left'; ctx.fillStyle = '#6b7580'; ctx.font = `400 26px ${font}`;
  const nNo = items.filter(i => i.noSub).length;
  ctx.fillText(`共 ${items.length} 項・${items.reduce((s, i) => s + i.qty, 0)} 件` + (nNo ? `・${nNo} 項請勿更換` : ''), P, 275);

  let y = headerH;
  ctx.fillStyle = '#f1f3f5'; ctx.fillRect(0, y, W, tableHead);
  ctx.fillStyle = '#495057'; ctx.font = `600 26px ${font}`;
  const mid = y + tableHead / 2;
  ctx.textAlign = 'left'; ctx.fillText('品名／編號', cols.name, mid);
  ctx.textAlign = 'center'; ctx.fillText('備註', cols.note, mid);
  ctx.textAlign = 'right'; ctx.fillText('數量', cols.qty, mid); ctx.fillText('單價', cols.price, mid); ctx.fillText('小計', cols.sub, mid);
  y += tableHead;

  let total = 0;
  rows.forEach((r, i) => {
    const it = r.it, sub = lineTotal(it); total += sub;
    if (i % 2) { ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, y, W, r.h); }
    // 縮圖（置中於列內，不改變列高）
    const ty = y + (r.h - TH) / 2;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(cols.thumb, ty, TH, TH);
    const im = thumbs[it.id];
    if (im) {
      const sc = Math.min(TH / im.width, TH / im.height), w = im.width * sc, h = im.height * sc;
      ctx.drawImage(im, cols.thumb + (TH - w) / 2, ty + (TH - h) / 2, w, h);
    }
    ctx.strokeStyle = '#e3e7eb'; ctx.lineWidth = 2; ctx.strokeRect(cols.thumb, ty, TH, TH);

    ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    ctx.fillStyle = '#1d2329'; ctx.font = `600 30px ${font}`;
    r.lines.forEach((ln, k) => ctx.fillText(ln, cols.name, y + 16 + k * 40));
    ctx.fillStyle = '#868e96'; ctx.font = `400 24px ${font}`;
    ctx.fillText(it.id + (it.unit ? `・${it.unit}入` : '') + (it.unavailable ? '・查無／下架' : ''), cols.name, y + 16 + r.lines.length * 40);

    // 備註：促銷 + 請勿更換，最多兩個標籤上下疊
    const chips = [];
    if (it.promo) chips.push([PROMO[it.promo], it.promo === 'bogo' ? '#f08c00' : '#7048e8']);
    if (it.noSub) chips.push(['請勿更換', '#d6262d']);
    ctx.font = `700 24px ${font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    chips.forEach(([t, col], k) => {
      const tw = ctx.measureText(t).width + 18, cy = y + 12 + k * 42;
      ctx.fillStyle = col; ctx.fillRect(cols.note - tw / 2, cy, tw, 36);
      ctx.fillStyle = '#ffffff'; ctx.fillText(t, cols.note, cy + 18);
    });
    ctx.textBaseline = 'top';
    ctx.textAlign = 'right'; ctx.fillStyle = '#1d2329'; ctx.font = `700 32px ${font}`;
    ctx.fillText('× ' + it.qty, cols.qty, y + 16);
    if (it.promo && it.qty >= 2) {
      ctx.fillStyle = '#868e96'; ctx.font = `400 22px ${font}`;
      ctx.fillText(it.promo === 'bogo' ? `含送 ${Math.floor(it.qty / 2)}` : `${Math.floor(it.qty / 2)} 件半價`, cols.qty, y + 58);
      ctx.fillStyle = '#1d2329';
    }
    ctx.font = `400 30px ${font}`; ctx.fillText(money(it.price), cols.price, y + 18);
    ctx.font = `700 32px ${font}`; ctx.fillStyle = '#d6262d'; ctx.fillText(money(sub), cols.sub, y + 16);
    y += r.h;
    ctx.fillStyle = '#e3e7eb'; ctx.fillRect(P, y - 1, W - P * 2, 1);
  });

  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#1d2329'; ctx.font = `700 36px ${font}`; ctx.textAlign = 'left';
  ctx.fillText('合計', P, y + 70);
  ctx.textAlign = 'right'; ctx.fillStyle = '#d6262d'; ctx.font = `800 52px ${font}`;
  ctx.fillText(money(total), W - P, y + 70);
  return c;
}
let shotBlob = null;
$('shot').onclick = async () => {
  if (!cust) { openCust(); return; }
  toast('產生截圖中…');
  const c = await drawList();
  $('shotImg').src = c.toDataURL('image/png');
  shotBlob = await new Promise(r => c.toBlob(r, 'image/png'));
  $('dlgShot').showModal();
};
const shotName = () => '萬家福購物車_' + new Date().toISOString().slice(0, 10) + '.png';
const isMobile = /iPhone|iPad|iPod|Android|Line\//i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function showSaveView() {
  $('saveImg').src = $('shotImg').src;
  $('dlgShot').close();
  $('saveView').style.display = 'block';
}
$('saveClose').onclick = () => { $('saveView').style.display = 'none'; };
$('dlShot').onclick = async () => {
  if (isMobile) {
    // 手機：優先叫出系統分享選單（裡面有「儲存影像」），不支援就顯示大圖讓使用者長按儲存
    try {
      const f = new File([shotBlob], shotName(), { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; }
    } catch (e) { if (e.name === 'AbortError') return; }
    showSaveView();
    return;
  }
  // 電腦：直接下載
  const url = URL.createObjectURL(shotBlob);
  const a = document.createElement('a'); a.href = url; a.download = shotName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
};
$('shareShot').onclick = async () => {
  try {
    const f = new File([shotBlob], shotName(), { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: '萬家福行動商店購物車' });
    else { showSaveView(); toast('這個瀏覽器不支援直接分享，請長按圖片儲存後再傳 LINE'); }
  } catch (e) { if (e.name !== 'AbortError') toast('分享失敗，請長按圖片儲存'); }
};

/* 開啟時：清單價格超過 6 小時自動更新 */
render();
if (gas && Object.keys(list).length && Date.now() - store.get('listTs', 0) > STALE_MS) refreshPrices(true);
</script>
